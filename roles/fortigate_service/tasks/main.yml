---
- name: Reconcile FortiGate test service
  fortinet.fortios.fortios_firewall_service_custom:
    vdom: "{{ fortigate_vdom }}"
    access_token: "{{ fortigate_api_token }}"
    state: "{{ service_state | default('present') }}"
    firewall_service_custom:
      name: "{{ test_service.name }}"
      protocol: TCP
      tcp_portrange: "{{ service_port | default(test_service.tcp_portrange) }}"
