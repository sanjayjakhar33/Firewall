---
- name: Retrieve the named address
  ansible.builtin.uri:
    url: "{{ fortigate_api_base }}/cmdb/firewall/address/{{ test_address.name | urlencode }}?vdom={{ fortigate_vdom | urlencode }}"
    method: GET
    headers:
      Authorization: "Bearer {{ fortigate_api_token }}"
    validate_certs: "{{ fortigate_validate_certs }}"
    return_content: true
    status_code: [200, 404]
  register: address_fact
  changed_when: false
  no_log: true

- name: Retrieve the named service
  ansible.builtin.uri:
    url: "{{ fortigate_api_base }}/cmdb/firewall.service/custom/{{ test_service.name | urlencode }}?vdom={{ fortigate_vdom | urlencode }}"
    method: GET
    headers:
      Authorization: "Bearer {{ fortigate_api_token }}"
    validate_certs: "{{ fortigate_validate_certs }}"
    return_content: true
    status_code: [200, 404]
  register: service_fact
  changed_when: false
  no_log: true

- name: Retrieve the test policy
  ansible.builtin.uri:
    url: "{{ fortigate_api_base }}/cmdb/firewall/policy/{{ test_policy.policyid }}?vdom={{ fortigate_vdom | urlencode }}"
    method: GET
    headers:
      Authorization: "Bearer {{ fortigate_api_token }}"
    validate_certs: "{{ fortigate_validate_certs }}"
    return_content: true
    status_code: [200, 404]
  register: policy_fact
  changed_when: false
  no_log: true

- name: Verify expected lab objects
  ansible.builtin.assert:
    that:
      - address_fact.status == 200
      - (address_fact.json.results | default({})).name == test_address.name
      - (address_fact.json.results | default({})).subnet == verify_address_subnet
      - service_fact.status == 200
      - (service_fact.json.results | default({})).name == test_service.name
      - (service_fact.json.results | default({})).protocol == test_service.protocol
      - (service_fact.json.results | default({})).tcp_portrange == verify_service_port
      - policy_fact.status == 200
      - (policy_fact.json.results | default({})).policyid | int == test_policy.policyid | int
      - (policy_fact.json.results | default({})).name == test_policy.name
      - (policy_fact.json.results | default({})).action == test_policy.action
      - (policy_fact.json.results | default({})).logtraffic == verify_policy_logtraffic
    fail_msg: "Expected address subnet, service port/protocol, or policy fields are absent or incorrect."
    success_msg: "Expected lab address, service, and policy are present."
