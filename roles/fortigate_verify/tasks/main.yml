---
- name: Retrieve address facts
  fortinet.fortios.fortios_configuration_fact:
    vdom: "{{ fortigate_vdom }}"
    access_token: "{{ fortigate_api_token }}"
    selector: firewall_address
  register: address_facts

- name: Retrieve service facts
  fortinet.fortios.fortios_configuration_fact:
    vdom: "{{ fortigate_vdom }}"
    access_token: "{{ fortigate_api_token }}"
    selector: firewall_service_custom
  register: service_facts

- name: Retrieve policy facts
  fortinet.fortios.fortios_configuration_fact:
    vdom: "{{ fortigate_vdom }}"
    access_token: "{{ fortigate_api_token }}"
    selector: firewall_policy
  register: policy_facts

- name: Verify expected lab objects
  ansible.builtin.assert:
    that:
      - >-
        (address_facts.meta.results | selectattr('name', 'equalto', test_address.name)
        | selectattr('subnet', 'equalto', verify_address_subnet) | list | length) == 1
      - >-
        (service_facts.meta.results | selectattr('name', 'equalto', test_service.name)
        | selectattr('protocol', 'equalto', test_service.protocol)
        | selectattr('tcp_portrange', 'equalto', verify_service_port) | list | length) == 1
      - >-
        (policy_facts.meta.results | selectattr('policyid', 'equalto', test_policy.policyid | int)
        | selectattr('name', 'equalto', test_policy.name)
        | selectattr('action', 'equalto', test_policy.action)
        | selectattr('logtraffic', 'equalto', verify_policy_logtraffic) | list | length) == 1
    fail_msg: "Expected address subnet, service port/protocol, or policy fields are absent or incorrect."
    success_msg: "Expected lab address, service, and policy are present."
