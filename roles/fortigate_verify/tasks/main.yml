---
- name: Retrieve address facts
  fortinet.fortios.fortios_configuration_fact:
    vdom: "{{ fortigate_vdom }}"
    access_token: "{{ fortigate_api_token }}"
    selector: firewall_address
  register: address_facts

- name: Retrieve service facts
  fortinet.fortios.fortios_configuration_fact:
    vdom: "{{ fortigate_vdom }}"
    access_token: "{{ fortigate_api_token }}"
    selector: firewall_service_custom
  register: service_facts

- name: Retrieve policy facts
  fortinet.fortios.fortios_configuration_fact:
    vdom: "{{ fortigate_vdom }}"
    access_token: "{{ fortigate_api_token }}"
    selector: firewall_policy
  register: policy_facts

- name: Verify expected lab objects
  ansible.builtin.assert:
    that:
      - test_address.name in (address_facts.meta.results | map(attribute='name') | list)
      - test_service.name in (service_facts.meta.results | map(attribute='name') | list)
      - (policy_facts.meta.results | selectattr('policyid', 'equalto', test_policy.policyid) | list | length) == 1
    fail_msg: "One or more expected ANSIBLE-TEST objects are absent or have an unexpected policy ID."
    success_msg: "Expected lab address, service, and policy are present."
