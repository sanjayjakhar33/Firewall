---
- name: Check installed collection versions
  hosts: localhost
  gather_facts: false
  tasks:
    - name: List netcommon and fortios versions
      ansible.builtin.command: ansible-galaxy collection list
      register: collection_list
      changed_when: false

    - name: Show relevant lines
      ansible.builtin.debug:
        msg: "{{ collection_list.stdout_lines | select('search', 'netcommon|fortios') | list }}"

- name: Validate FortiGate API connectivity
  hosts: fortigates
  gather_facts: false
  tasks:
    - name: Hash token for comparison (safe - not the raw value)
      ansible.builtin.debug:
        msg: "Token SHA256: {{ fortigate_api_token | hash('sha256') }}"

    - name: Check token variable is actually populated (length only, not the value)
      ansible.builtin.debug:
        msg: "Token length: {{ fortigate_api_token | length }} | VDOM: {{ fortigate_vdom }} | Host var: {{ fortigate_host_raw | default('undefined') }}"

    - name: Query FortiOS system status
      fortinet.fortios.fortios_monitor_fact:
        vdom: "{{ fortigate_vdom }}"
        access_token: "{{ fortigate_api_token }}"
        selector: system_status
      register: system_status
      ignore_errors: true

    - name: Show failure reason only (no token)
      ansible.builtin.debug:
        msg: "Failed: {{ system_status.msg | default('no msg') }} | HTTP status: {{ system_status.http_status | default(system_status.status | default('n/a')) }}"
      when: system_status is failed

    - name: Report non-sensitive connection details
      ansible.builtin.debug:
        msg:
          - "FortiGate API reachable and authenticated"
          - "VDOM: {{ fortigate_vdom }}"
          - "Hostname: {{ system_status.meta.results.hostname | default('returned by FortiGate') }}"
          - "FortiOS version: {{ system_status.meta.results.version | default('returned by FortiGate') }}"
      when: system_status is succeeded---
