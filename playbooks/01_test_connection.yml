---
- name: Validate FortiGate API connectivity (bypass httpapi connection plugin)
  hosts: localhost
  gather_facts: false
  vars:
    fortigate_host: "{{ lookup('env', 'FORTIGATE_HOST') }}"
    fortigate_vdom: "{{ lookup('env', 'FORTIGATE_VDOM') | default('root', true) }}"
    fortigate_api_token: "{{ lookup('env', 'FORTIGATE_API_TOKEN') }}"
  tasks:
    - name: Query FortiOS system status via plain REST call
      ansible.builtin.uri:
        url: "https://{{ fortigate_host }}/api/v2/monitor/system/status?vdom={{ fortigate_vdom }}"
        method: GET
        headers:
          Authorization: "Bearer {{ fortigate_api_token }}"
        validate_certs: false
        return_content: true
      register: result
      no_log: true

    - name: Show result
      ansible.builtin.debug:
        msg: "Status: {{ result.status }} | Hostname: {{ (result.content | from_json).hostname | default('n/a') }}"
